upstream fastapi_app {
    server api:8000;
}

server {
    listen 80;
    client_max_body_size 10M;

    # Frontend statico (stessa grafica del sito OLIO)
    root /usr/share/nginx/html;
    index index.html;

    # Endpoint API serviti da FastAPI
    location ~ ^/(auth|products|cart|orders|health|docs|redoc|openapi.json)(/|$) {
        proxy_pass http://fastapi_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File statici del backend (se presenti)
    location /static/ {
        alias /app/static/;
    }

    # Frontend: tutto il resto viene servito come pagina statica
    location / {
        try_files $uri $uri/ /index.html;
    }
}
